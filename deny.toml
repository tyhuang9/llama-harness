[advisories]
version = 2
yanked = "deny"
# Linux GTK3/proc-macro path: tauri -> gtk/glib -> proc-macro-error. These are
# unmaintained notices, not known vulnerabilities. Owner: Tauri integration
# maintainers. TODO/review trigger: every Tauri upgrade or any advisory severity
# change; remove entries as soon as the upstream GTK path no longer resolves them.
ignore = [
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0412", "RUSTSEC-2024-0413", "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416", "RUSTSEC-2024-0418", "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # Unicode/urlpattern path: tauri-utils -> urlpattern -> unic-*. Owner: Tauri
  # integration maintainers. TODO/review trigger: every Tauri/urlpattern upgrade
  # or any advisory severity change; remove when urlpattern drops unic 0.9.
  "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
]

[licenses]
version = 2
confidence-threshold = 0.8
# `LGPL-2.1-or-later` enters through Tauri's GTK/glib Linux dependency path.
# Linux builds dynamically link those compatible system libraries, preserving a
# recipient's ability to replace/relink them. Release distributions must retain
# the applicable LGPL license and copyright notices; reassess this allowance if
# a Tauri/GTK change bundles or statically links the libraries.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

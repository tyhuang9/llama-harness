[workspace]
members = [
  "crates/llama-harness",
  "crates/llama-harness-protocol",
  "crates/llama-harness-runtime",
  "crates/llama-harness-core",
  "crates/llama-harness-ollama",
  "crates/llama-harness-observability",
  "crates/llama-harness-evals",
  "crates/llama-harness-promptfoo",
  "crates/llama-harness-cli",
  "examples/local-task-agent",
  "xtask",
]
exclude = ["apps/harness-console/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/tyhuang9/llama-harness"
homepage = "https://github.com/tyhuang9/llama-harness"
readme = "README.md"

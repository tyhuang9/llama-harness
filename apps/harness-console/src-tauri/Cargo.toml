[package]
name = "llama-harness-console"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "llama_harness_console"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
llama-harness-core = { version = "0.2.0", path = "../../../crates/llama-harness-core" }
llama-harness-evals = { version = "0.2.0", path = "../../../crates/llama-harness-evals" }
llama-harness-observability = { version = "0.2.0", path = "../../../crates/llama-harness-observability" }
llama-harness-ollama = { version = "0.2.0", path = "../../../crates/llama-harness-ollama" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

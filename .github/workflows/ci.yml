name: Continuous verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-portable-facade:
    name: Portable facade / stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - name: Reject Tauri from the portable facade dependency graph
        shell: pwsh
        run: |
          $tree = cargo tree --locked --package llama-harness --no-default-features --features "ollama,observability,evals,programmatic,mcp"
          if ($tree -match '(?m)(llama-harness-tauri|tauri) v') {
            throw "The portable facade dependency graph unexpectedly contains Tauri."
          }
      - name: Test the portable facade and integrations
        run: cargo test --locked --package llama-harness --no-default-features --features ollama,observability,evals,programmatic,mcp

  rust-full-platform:
    name: Full workspace / stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  rust-msrv:
    name: Rust 1.88 MSRV / fresh resolution
    runs-on: ubuntu-22.04
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: 1.88.0
      - name: Resolve from scratch and check every target at the MSRV
        run: |
          rm Cargo.lock
          cargo generate-lockfile
          cargo check --workspace --all-targets --all-features

  rust-release-readiness:
    name: Rust release readiness / stable
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Block Rust advisory, license, and source-policy failures
        run: cargo deny check advisories licenses sources
      - name: Verify release validation scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify Rust release, package archives, and extracted consumers
        run: cargo run --locked -p xtask -- release-check
      - name: Verify workspace consumers
        run: |
          cargo test --locked --package local-task-agent --all-targets
          cargo test --locked --package tauri-agent-host --all-targets --all-features
      - name: Verify protocol contract
        run: cargo run --locked -p xtask -- protocol-check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      - name: Verify documentation build inputs
        run: |
          npm --prefix docs test
          npm --prefix docs run check

  rust-docs:
    name: Rust API docs / stable / strict
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - name: Enforce complete, warning-free publishable-crate documentation
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links -D missing_docs
        run: >-
          cargo doc --locked --no-deps --all-features
          --package llama-harness-programmatic-sandbox
          --package llama-harness-core
          --package llama-harness-ollama
          --package llama-harness-observability
          --package llama-harness-evals
          --package llama-harness-mcp
          --package llama-harness-tauri
          --package llama-harness

  rust-semver:
    name: Rust API compatibility from v0.1.0
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect the post-release API baseline tag
        id: baseline_tag
        shell: bash
        run: |
          if git rev-parse --verify --quiet refs/tags/v0.1.0 > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - name: Validate the recorded initial API baseline
        shell: pwsh
        run: scripts/semver/check-rust-semver.ps1 -ValidateOnly
      - name: Record the initial API baseline before the v0.1.0 release
        if: steps.baseline_tag.outputs.exists != 'true'
        shell: pwsh
        run: scripts/semver/check-rust-semver.ps1 -RecordInitialBaseline
      - name: Install pinned cargo-semver-checks after the initial release
        if: steps.baseline_tag.outputs.exists == 'true'
        run: cargo install cargo-semver-checks --version 0.49.0 --locked
      - name: Check the eight recorded public APIs after the initial release
        if: steps.baseline_tag.outputs.exists == 'true'
        shell: pwsh
        run: scripts/semver/check-rust-semver.ps1

  sdk-typescript:
    name: TypeScript SDK validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Test and inspect TypeScript SDK package
        shell: pwsh
        run: |
          npm --prefix sdks/typescript ci
          npm --prefix sdks/typescript test
          npm --prefix sdks/typescript pack --workspace @llama-harness/sdk
          python scripts/inspect_npm_package.py --package llama-harness-sdk-0.2.0.tgz --name @llama-harness/sdk --version 0.2.0

  sdk-python:
    name: Python SDK validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Test, build, and inspect Python SDK package
        shell: pwsh
        run: |
          cargo build --locked -p llama-harness-runtime -p llama-harness-scripted-runtime
          $env:PYTHONPATH = "sdks/python/src"
          python -m unittest discover -s sdks/python/tests -v
          python -m pip install --disable-pip-version-check build==1.5.0
          python -m build --wheel --outdir sdk-dist sdks/python
          python scripts/inspect_python_packages.py --dist sdk-dist --version 0.2.0

  developer-console-audit:
    name: Developer console audit (nonblocking)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      - name: Check the console's locked Rust dependency graph
        run: cargo check --manifest-path apps/harness-console/src-tauri/Cargo.toml --locked
      - name: Test the console's locked Rust crate
        run: cargo test --manifest-path apps/harness-console/src-tauri/Cargo.toml --locked
      - run: npm --prefix apps/harness-console ci
      - name: Report development-tool audit findings without blocking runtime release gates
        continue-on-error: true
        run: npm --prefix apps/harness-console audit --audit-level=high

name: Manual release validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version already reflected in package metadata
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish only after manual artifact and package review
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: llama-harness-runtime.exe
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: llama-harness-runtime
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: llama-harness-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, inspect, and stage platform SDK archives
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check build wheel
          pwsh -File scripts/validate_release.ps1 -Platform ${{ matrix.platform }} -Target ${{ matrix.target }} -Executable ${{ matrix.executable }} -Version ${{ inputs.version }} -Output release-stage/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: llama-harness-${{ matrix.platform }}
          path: |
            release-stage/${{ matrix.platform }}/artifacts/*
          if-no-files-found: error
  sdk:
    name: SDK package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SDK npm package
        shell: pwsh
        run: |
          $npmVersion = node -p "require('./sdks/typescript/packages/sdk/package.json').version"
          if ($npmVersion -ne "${{ inputs.version }}") { throw "npm SDK version $npmVersion does not match release input" }
          npm --prefix sdks/typescript ci
          npm --prefix sdks/typescript test
          npm --prefix sdks/typescript pack --workspace @llama-harness/sdk
          python scripts/inspect_npm_package.py --package llama-harness-sdk-${{ inputs.version }}.tgz --name @llama-harness/sdk --version ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: llama-harness-npm-sdk
          path: llama-harness-sdk-${{ inputs.version }}.tgz
          if-no-files-found: error
  rust-release-check:
    name: Rust release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- release-check
  manifest:
    needs: [runtime, sdk, rust-release-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/write_release_manifest.py --artifacts release-artifacts --version ${{ inputs.version }} --output release-artifacts/release-manifest.json
      - run: python scripts/inspect_release_artifacts.py --artifacts release-artifacts --version ${{ inputs.version }} --platform win32-x64 --platform darwin-arm64 --platform linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: llama-harness-release-manifest
          path: release-artifacts/
      - name: Publication gate
        if: ${{ inputs.publish }}
        run: |
          echo "Publication remains a separate, human-approved operation."
          echo "Review checksums, package contents, registry credentials, and ordered publish dry-runs before enabling registry upload steps."

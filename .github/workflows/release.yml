name: Manual release validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable SemVer already reflected in package metadata
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: llama-harness-runtime.exe
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: llama-harness-runtime
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: llama-harness-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Validate release input
        shell: pwsh
        run: python scripts/validate_release_version.py "$env:RELEASE_VERSION"
      - name: Build, inspect, and stage platform SDK archives
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check build==1.5.0 wheel==0.48.0
          pwsh -File scripts/validate_release.ps1 -Platform "${{ matrix.platform }}" -Target "${{ matrix.target }}" -Executable "${{ matrix.executable }}" -Version "$env:RELEASE_VERSION" -Output "release-stage/${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-harness-${{ matrix.platform }}
          path: release-stage/${{ matrix.platform }}/artifacts/*
          if-no-files-found: error

  sdk:
    name: SDK package validation
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: 1.96.0
      - name: Validate release input
        shell: pwsh
        run: python scripts/validate_release_version.py "$env:RELEASE_VERSION"
      - name: Build SDK npm package
        shell: pwsh
        run: |
          $npmVersion = node -p "require('./sdks/typescript/packages/sdk/package.json').version"
          if ($npmVersion -ne $env:RELEASE_VERSION) { throw "npm SDK version $npmVersion does not match release input" }
          npm --prefix sdks/typescript ci
          npm --prefix sdks/typescript test
          npm --prefix sdks/typescript pack --workspace @llama-harness/sdk
          python scripts/inspect_npm_package.py --package "llama-harness-sdk-$($env:RELEASE_VERSION).tgz" --name @llama-harness/sdk --version "$env:RELEASE_VERSION"
      - name: Test and inspect the Python SDK acceptance package
        shell: pwsh
        run: |
          cargo build --locked -p llama-harness-runtime -p llama-harness-scripted-runtime
          $env:PYTHONPATH = "sdks/python/src"
          python -m unittest discover -s sdks/python/tests -v
          python -m pip install --disable-pip-version-check build==1.5.0
          python -m build --wheel --outdir sdk-dist sdks/python
          python scripts/inspect_python_packages.py --dist sdk-dist --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-harness-npm-sdk
          path: llama-harness-sdk-${{ env.RELEASE_VERSION }}.tgz
          if-no-files-found: error

  rust-release-check:
    name: Rust release validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, reviewed 2026-08-13
        with:
          toolchain: 1.96.0
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Block Rust advisory, license, and source-policy failures
        run: cargo deny check advisories licenses sources
      - run: cargo run --locked -p xtask -- release-check

  manifest:
    needs: [runtime, sdk, rust-release-check]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
      - name: Validate release input
        shell: pwsh
        run: python scripts/validate_release_version.py "$env:RELEASE_VERSION"
      - name: Write and inspect exact combined artifact set
        shell: pwsh
        run: |
          python scripts/write_release_manifest.py --artifacts release-artifacts --version "$env:RELEASE_VERSION" --output release-artifacts/release-manifest.json
          python scripts/inspect_release_artifacts.py --artifacts release-artifacts --version "$env:RELEASE_VERSION" --platform win32-x64 --platform darwin-arm64 --platform linux-x64 --require-sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-harness-release-manifest
          path: release-artifacts/
          if-no-files-found: error

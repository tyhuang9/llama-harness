[package]
name = "llama-harness-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Managed stdio sidecar for non-Rust llama-harness SDKs"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/llama-harness-runtime"
keywords = ["agents", "sidecar", "sdk"]
categories = ["development-tools", "asynchronous"]
publish = false

[[bin]]
name = "llama-harness-runtime"
path = "src/main.rs"
doc = false

[dependencies]
async-trait = "0.1"
llama-harness-core = { version = "0.2.0", path = "../llama-harness-core" }
llama-harness-ollama = { version = "0.2.0", path = "../llama-harness-ollama" }
llama-harness-protocol = { version = "0.2.0", path = "../llama-harness-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[package]
name = "llama-harness-programmatic-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic no-std program sandbox contracts for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-programmatic-sandbox"
keywords = ["agents", "sandbox", "no-std"]
categories = ["no-std", "development-tools"]
publish = ["crates-io"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"

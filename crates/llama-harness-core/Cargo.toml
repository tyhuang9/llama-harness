[package]
name = "llama-harness-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded, provider-neutral agent runtime for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-core"
keywords = ["agents", "llm", "tools"]
categories = ["development-tools", "asynchronous"]
publish = ["crates-io"]

[dependencies]
async-trait = "0.1"
blake3 = "1"
futures-core = "0.3"
futures-util = "0.3"
jsonschema = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }

[package]
name = "llama-harness-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedded Tauri helpers for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-tauri"
keywords = ["agents", "tauri", "events"]
categories = ["development-tools", "asynchronous"]
publish = ["crates-io"]

[dependencies]
async-trait = "0.1"
llama-harness-core = { version = "0.1.0", path = "../llama-harness-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = [] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

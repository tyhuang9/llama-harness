[package]
name = "llama-harness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local developer CLI for llama-harness"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/llama-harness-cli"
keywords = ["agents", "cli", "evaluation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "llama-harness"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
llama-harness-core = { version = "0.2.0", path = "../llama-harness-core" }
llama-harness-evals = { version = "0.2.0", path = "../llama-harness-evals" }
llama-harness-observability = { version = "0.2.0", path = "../llama-harness-observability" }
llama-harness-ollama = { version = "0.2.0", path = "../llama-harness-ollama" }
llama-harness-promptfoo = { version = "0.2.0", path = "../llama-harness-promptfoo" }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[package]
name = "llama-harness-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Transport-neutral MCP tool adapter for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-mcp"
keywords = ["agents", "mcp", "tools"]
categories = ["asynchronous", "development-tools"]
publish = ["crates-io"]

[dependencies]
async-trait = "0.1"
blake3 = "1"
llama-harness-core = { version = "0.1.0", path = "../llama-harness-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

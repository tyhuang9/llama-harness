[package]
name = "llama-harness-evals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic evaluation and replay contracts for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-evals"
keywords = ["agents", "evaluation", "testing"]
categories = ["development-tools", "development-tools::testing"]
publish = ["crates-io"]

[dependencies]
async-trait = "0.1"
llama-harness-core = { version = "0.2.0", path = "../llama-harness-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
llama-harness-core = { version = "0.2.0", path = "../llama-harness-core", features = ["programmatic"] }
llama-harness-observability = { version = "0.2.0", path = "../llama-harness-observability" }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-util = "0.7"

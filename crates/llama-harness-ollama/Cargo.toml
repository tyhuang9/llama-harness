[package]
name = "llama-harness-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Direct loopback Ollama provider for llama-harness"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/llama-harness-ollama"
keywords = ["agents", "ollama", "llm"]
categories = ["api-bindings", "asynchronous"]
publish = ["crates-io"]

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
llama-harness-core = { version = "0.1.0", path = "../llama-harness-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[package]
name = "llama-harness-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Redacted local SQLite trace persistence for llama-harness"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/llama-harness-observability"
keywords = ["agents", "observability", "sqlite"]
categories = ["development-tools", "database"]
publish = ["crates-io"]

[dependencies]
llama-harness-core = { version = "0.1.0", path = "../llama-harness-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

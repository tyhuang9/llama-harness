[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llama-harness"
version = "0.1.0"
description = "Async Python SDK for the managed llama-harness Rust sidecar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llama-harness contributors" }]
keywords = ["agents", "llm", "sidecar", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Repository = "https://github.com/tyhuang9/llama-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
